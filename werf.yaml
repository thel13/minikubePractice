project: k8s
configVersion: 1
---
---
image: app
from: alpine:3.18
import:
- image: build
  add: /goapp
  to: /app/goapp
  after: install
- image: build
  add: /app/templates
  to: /app/templates
  after: install
- image: build
  add: /app/static
  to: /app/static
  after: install
docker:
  WORKDIR: /app
  CMD: ["/app/goapp"]
